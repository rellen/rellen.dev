<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rellen.dev - $title$</title>
    $if(description)$
    <meta name="description" content="$description$" />
    $else$
    <meta name="description" content="Rob's technical blog and ramblings" />
    $endif$

    <!-- Open Graph -->
    <meta property="og:site_name" content="rellen.dev" />
    <meta property="og:title" content="$title$" />
    $if(description)$
    <meta property="og:description" content="$description$" />
    $else$
    <meta property="og:description" content="Rob's technical blog and ramblings" />
    $endif$
    $if(og_type)$
    <meta property="og:type" content="$og_type$" />
    $else$
    <meta property="og:type" content="website" />
    $endif$
    <meta property="og:url" content="$url$" />
    <meta property="og:locale" content="en_AU" />
    <meta property="og:image" content="$siteRoot$/images/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary" />

    <link rel="preload" href="/fonts/AtkinsonHyperlegibleNext-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/AtkinsonHyperlegibleNext-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/AtkinsonHyperlegibleNext-SemiBold.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <header>
      <a href="/">
        <img src="/images/logo.svg" alt="" />
        Rob's Ramblings</a>
      <nav aria-label="Main">
        <a href="/posts">Posts</a>
        <a href="/notes">Notes</a>
        <a href="/talks.html">Talks</a>
        <a href="/about.html">About</a>
      </nav>
    </header>

    <main role="main">
      $body$
    </main>

    <footer>
      Site proudly generated by
      <a href="http://jaspervdj.be/hakyll">Hakyll</a>
    </footer>
  </body>
</html>
