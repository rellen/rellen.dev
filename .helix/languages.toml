[[language]]
name = "nix"
language-servers = ["devenv-lsp"]

[language-server.devenv-lsp]
command = "devenv"
args = ["lsp"]

[[language]]
name = "haskell"
formatter = { command = "ormolu", args = ["--mode", "stdout", "--stdin-input-file", "./"]}
auto-format = true

[[language]]
name = "html"
formatter = { command = "prettier" }

[[language]]
name = "dhall"
auto-format = true
